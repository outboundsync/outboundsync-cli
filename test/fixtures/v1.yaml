      type: object
      additionalProperties: false
      required: [queued, sourceId, retryAvailableAt, retryAfterSeconds]
      properties:
        queued:
          type: boolean
          description: |
            True when the batch was accepted. This is not a count of eligible
            rows; a source with nothing to retry still returns true.
        sourceId:
          type: integer
          description: Source whose failed syncs were queued.
        retryAvailableAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When another bulk retry of this source will be accepted, measured
            from the request that started the current 24-hour window. Null when
            `queued` is false.
        retryAfterSeconds:
          type: ["integer", "null"]
          description: |
            Seconds from this response until `retryAvailableAt`. Null when
            `queued` is false.
