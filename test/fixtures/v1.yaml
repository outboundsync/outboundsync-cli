openapi: 3.1.0
# Hand-authored source of truth for API v1. NOT generated by @nestjs/swagger:
# v1 responses are plain interfaces in @outboundsync/models, not decorated DTO
# classes, so there is nothing for decorator-based generation to introspect.
# Keep this in sync with those interfaces — v1-openapi.contract.spec.ts fails
# if the two drift.
info:
  title: OutboundSync API
  version: "1.0.0"
  description: |
    Public REST API for OutboundSync account introspection, pipeline status,
    and contact prior-outreach enrichment for spreadsheet tools (ZoomInfo GTM
    Studio, Clay, Databar, Freckle, and similar).
    Authenticate with a Bearer token: `Authorization: Bearer osapi_<key>`.

    Machine-readable contract for API v1. Human reference:
    https://outboundsync.com/docs/api/v1
  contact:
    name: OutboundSync
    url: https://outboundsync.com
servers:
  - url: https://app.outboundsync.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Discovery
    description: Auth-free OpenAPI document endpoints
  - name: Platform
    description: Public, unauthenticated platform health checks
  - name: Account
    description: Identity and pipeline readiness
  - name: Setup
    description: Wizard progress (test, waiting/live) — distinct from account/status live-sync readiness
  - name: Connections
    description: CRM connections
  - name: Sources
    description: Inbound sequencer paste URLs
  - name: Destinations
    description: Outbound forwarding endpoints, reply relays, and delivery history
  - name: Contacts
    description: Prior outreach and contact engagement lookups
  - name: Requests
    description: Inbound webhook receipts accepted at sources
  - name: Syncs
    description: CRM sync attempts for received requests
  - name: Webhooks
    description: Sync Monitoring webhook endpoint management
  - name: Events
    description: Sync Monitoring event log and delivery status
  - name: Blocklists
    description: CRM to SEP blocklist sync configurations
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [Platform]
      summary: Platform liveness
      description: |
        Liveness probe. Returns 200 whenever the platform process is reachable
        and does no downstream checks. No API key required. Lives at the host
        root, not under /api/v1.
      security: []
      responses:
        "200":
          description: Platform process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [Platform]
      summary: Platform readiness
      description: |
        Readiness probe. Reports whether the platform can receive and sync
        events right now, with per-component checks. `GET /health` is an alias.
        Returns 200 for operational/partial_outage and 503 for a total outage.
        No API key required. Lives at the host root, not under /api/v1.
      security: []
      responses:
        "200":
          description: Readiness snapshot (operational or partial_outage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
        "503":
          description: Total outage — every component check is in outage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiJson
      tags: [Discovery]
      summary: OpenAPI 3.1 document (JSON)
      description: Auth-free machine-readable API contract.
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags: [Discovery]
      summary: OpenAPI 3.1 document (YAML)
      description: Auth-free machine-readable API contract (source form).
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: API key identity and related links
      description: |
        Returns account, API key metadata, accessible CRM connections, and links
        to related v1 endpoints. Use as the bootstrap call after authentication.
      responses:
        "200":
          description: Identity and discovery links
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/account/status:
    get:
      operationId: getAccountStatus
      tags: [Account]
      summary: Pipeline readiness
      description: |
        Point-in-time pipeline status across all connections the key can access.
        Authenticated-but-not-ready returns HTTP 200 with `ready: false`.
      responses:
        "200":
          description: Readiness snapshot
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      tags: [Setup]
      summary: Setup wizard progress
      description: |
        Point-in-time setup / wizard status for connections the key can access.
        Answers whether sources are created, OutboundSync tests succeeded, and
        live SEP traffic has been received. Each connection also reports
        `syncEntitled`; whether it can live-sync right now (entitled and sync
        enabled) is `GET /api/v1/account/status`.

        Do not confuse with `GET /api/v1/account/status`, which answers whether
        a connection may live-sync (CRM OAuth + entitlement + ≥1 source).
        Account-status `ready` does **not** mean the SEP webhook is wired.
      responses:
        "200":
          description: Setup status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /api/v1/account/metrics:
    get:
      operationId: getAccountMetrics
      tags: [Account]
      summary: Request, sync, and destination-delivery counts for a date range
      description: |
        One-shot rollup for dashboards. `requests`, `syncs`, and
        `destinationDeliveries` use the same shapes as the dedicated metrics
        endpoints. Date span must not exceed 31 days.

        `connectionId` restricts all three legs; an id outside the key's access
        returns zeros for that scope, not 404. `sourceId` restricts **requests**
        and **syncs** only — `destinationDeliveries` stays connection-scoped.
      parameters:
        - $ref: "#/components/parameters/DateRangeFrom"
        - $ref: "#/components/parameters/DateRangeTo"
        - $ref: "#/components/parameters/ConnectionIdQuery"
        - $ref: "#/components/parameters/SourceIdQuery"
      responses:
        "200":
          description: Metrics rollup for the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMetricsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/connections:
    get:
      operationId: listConnections
      tags: [Connections]
      summary: List CRM connections
      description: CRM connections with embedded status and capability flags.
      responses:
        "200":
          description: Named list wrapper
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/contacts/outreach:
    get:
      operationId: getContactOutreach
      tags: [Contacts]
      summary: Prior outreach summary for a contact email and/or social profile
      description: |
        Aggregated prior engagement for contact identities across accessible CRM
        connections. Pass `email` and/or one or more `profileUrl` values (LinkedIn
        `/in/…` or `/pub/…`, or X/Twitter). At least one identity is required. At
        most 5 `profileUrl` values. All supplied identities are OR-unioned into
        one aggregate (intended for one contact row — do not mix unrelated people).

        Social-only sequencer events: HubSpot/Salesforce backfill `to_email` with
        the profile URL when email is missing — use `profileUrl` for those
        lookups. Prefer `email` when available (broader CRM + category coverage).

        Profile URL matching expands scheme/www/case/slash variants (scheme
        optional) and canonicalizes LinkedIn overlay/mwlite/country hosts to
        `/in|pub/{slug}` and X status URLs to `/{handle}`.

        Counts are deduped by inbound payload id **per event type × platform**
        (CRM retry duplicate logs). Designed for spreadsheet enrichment tools
        (ZoomInfo GTM Studio, Clay, Databar, Freckle, and similar).

        `everContacted` excludes open/click-only tracking and passive social
        views/likes. `found` is true when webhook log rows and/or a lead category
        signal exist. `doNotContact` covers hard signals only (bounce / unsubscribe).
        `blocklists` is a reserved CRM blocklist namespace — `evaluated` is always
        false in this release (do not treat `matched: false` as "not on a list").
        Company/domain rollup is a separate reserved path
        (`GET /api/v1/accounts/outreach?domain=`, not implemented) — do not pass a
        bare domain as `email` or `profileUrl` here.
        Timestamps are processing time (`webhook_logs.created_at`).

        Rate limit: 600 requests / 60 seconds per account (separate from the
        general v1 120/min limit).
      parameters:
        - name: email
          in: query
          required: false
          description: Contact email (case-insensitive normalize on input). Optional when profileUrl is provided.
          schema:
            type: string
            format: email
          example: jane@acme.com
        - name: profileUrl
          in: query
          required: false
          description: |
            LinkedIn (`/in/…` or `/pub/…`) or X/Twitter profile URL. Scheme is
            optional (e.g. `linkedin.com/in/jane`). Repeat the parameter or
            comma-separate to pass multiple (max 5). Optional when email is provided.
            Profile-URL matching resolves only for contacts synced through HubSpot or
            Salesforce; Attio/Close/HighLevel/Pipedrive social-only events are not
            matched by `profileUrl` — pass `email` for those.
          schema:
            type: array
            maxItems: 5
            items:
              type: string
          style: form
          explode: true
          example:
            - https://www.linkedin.com/in/jane-doe
            - https://x.com/jane
      responses:
        "200":
          description: Aggregated prior outreach for the identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactOutreachResponse"
              examples:
                found:
                  summary: Prior outreach found (email + profile URLs)
                  value:
                    email: jane@acme.com
                    query:
                      email: jane@acme.com
                      profileUrls:
                        - https://linkedin.com/in/jane-doe
                        - https://x.com/jane
                    found: true
                    summary:
                      everContacted: true
                      everEmailed: true
                      everOpened: true
                      everCalled: false
                      everSocialTouched: true
                      totalEvents: 47
                      firstTouchAt: "2025-11-02T14:01:00.000Z"
                      lastTouchAt: "2026-07-20T18:22:00.000Z"
                      daysSinceLastTouch: 9
                      lastEventType: EMAIL_REPLY
                      lastPlatform: smartlead
                    eventTypes:
                      - eventType: EMAIL_SENT
                        count: 12
                        firstAt: "2025-11-02T14:01:00.000Z"
                        lastAt: "2026-07-18T10:00:00.000Z"
                      - eventType: EMAIL_OPEN
                        count: 28
                        firstAt: "2025-11-02T15:00:00.000Z"
                        lastAt: "2026-07-19T12:00:00.000Z"
                      - eventType: EMAIL_REPLY
                        count: 1
                        firstAt: "2026-07-20T18:22:00.000Z"
                        lastAt: "2026-07-20T18:22:00.000Z"
                    platforms:
                      - platform: smartlead
                        count: 40
                        lastAt: "2026-07-20T18:22:00.000Z"
                        lastEventType: EMAIL_REPLY
                      - platform: heyreach
                        count: 7
                        lastAt: "2026-06-01T09:00:00.000Z"
                        lastEventType: MESSAGE_SENT
                    outcomes:
                      replied: true
                      lastReplyAt: "2026-07-20T18:22:00.000Z"
                      bounced: false
                      unsubscribed: false
                      lastCategoryName: Interested
                      lastCategoryAt: "2026-07-21T09:00:00.000Z"
                    doNotContact:
                      value: false
                      reasons: []
                    blocklists:
                      evaluated: false
                      matched: false
                      matches: []
                notFound:
                  summary: No prior outreach for the identities
                  value:
                    email: unknown@acme.com
                    query:
                      email: unknown@acme.com
                      profileUrls: []
                    found: false
                    summary:
                      everContacted: false
                      everEmailed: false
                      everOpened: false
                      everCalled: false
                      everSocialTouched: false
                      totalEvents: 0
                      firstTouchAt: null
                      lastTouchAt: null
                      daysSinceLastTouch: null
                      lastEventType: null
                      lastPlatform: null
                    eventTypes: []
                    platforms: []
                    outcomes:
                      replied: false
                      lastReplyAt: null
                      bounced: false
                      unsubscribed: false
                      lastCategoryName: null
                      lastCategoryAt: null
                    doNotContact:
                      value: false
                      reasons: []
                    blocklists:
                      evaluated: false
                      matched: false
                      matches: []
                profileOnly:
                  summary: Social profile lookup (no email)
                  value:
                    email: null
                    query:
                      email: null
                      profileUrls:
                        - https://www.linkedin.com/in/jane-doe
                    found: true
                    summary:
                      everContacted: true
                      everEmailed: false
                      everOpened: false
                      everCalled: false
                      everSocialTouched: true
                      totalEvents: 3
                      firstTouchAt: "2026-06-01T09:00:00.000Z"
                      lastTouchAt: "2026-06-10T12:00:00.000Z"
                      daysSinceLastTouch: 49
                      lastEventType: MESSAGE_SENT
                      lastPlatform: heyreach
                    eventTypes:
                      - eventType: MESSAGE_SENT
                        count: 3
                        firstAt: "2026-06-01T09:00:00.000Z"
                        lastAt: "2026-06-10T12:00:00.000Z"
                    platforms:
                      - platform: heyreach
                        count: 3
                        lastAt: "2026-06-10T12:00:00.000Z"
                        lastEventType: MESSAGE_SENT
                    outcomes:
                      replied: false
                      lastReplyAt: null
                      bounced: false
                      unsubscribed: false
                      lastCategoryName: null
                      lastCategoryAt: null
                    doNotContact:
                      value: false
                      reasons: []
                    blocklists:
                      evaluated: false
                      matched: false
                      matches: []
        "400":
          description: Missing identities or invalid email/profileUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingIdentity:
                  summary: Neither email nor profileUrl provided
                  value:
                    statusCode: 400
                    message: 'Provide at least one identity: query parameter "email" and/or "profileUrl"'
                    error: Bad Request
                invalidProfileUrl:
                  summary: profileUrl is not LinkedIn /in|/pub or X
                  value:
                    statusCode: 400
                    message: 'Query parameter "profileUrl" must be a LinkedIn (/in/… or /pub/…) or X/Twitter profile URL'
                    error: Bad Request
                tooManyProfileUrls:
                  summary: More than 5 profileUrl values
                  value:
                    statusCode: 400
                    message: 'Query parameter "profileUrl" accepts at most 5 values'
                    error: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/destinations:
    get:
      operationId: listDestinations
      tags: [Destinations]
      summary: List forwarding destinations
      description: |
        Forwarding destination catalog for accessible connections — customer
        URLs OutboundSync forwards received events to. Distinct from reply
        relays. Bindings also appear nested on `GET /api/v1/sources`.

        Not cursor-paginated. Rows are ordered by id ascending. When the key
        has no accessible connections, the response is `{ "destinations": [] }`.
      responses:
        "200":
          description: Named list wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/destinations/reply-relays:
    get:
      operationId: listDestinationReplyRelays
      tags: [Destinations]
      summary: List reply-relay destinations
      description: |
        Reply-relay destinations for accessible connections. Each relay CCs a
        configured address onto matched replies; the response includes the
        source (webhook) IDs currently bound to each relay.

        `categoryAllowlist` is an array of `{ id, name }` objects. Empty means
        all replies; when non-empty, Reply-CC checks the lead's current
        sequencer categories or tags at execute time and continues only on a
        match.
      responses:
        "200":
          description: Named list wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationsReplyRelaysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/destinations/{id}:
    get:
      operationId: getDestination
      tags: [Destinations]
      summary: Get one forwarding destination
      description: |
        One forwarding destination by id. Returns 404 when that destination is
        missing or its connection is not in the key's access.
      parameters:
        - $ref: "#/components/parameters/DestinationIdPath"
      responses:
        "200":
          description: Destination resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/destinations/{id}/deliveries:
    get:
      operationId: listDestinationDeliveries
      tags: [Destinations]
      summary: List outbound delivery attempts for one destination
      description: |
        One row per HTTP POST OutboundSync sent to that forwarding URL.
        Distinct from Sync Monitoring webhook deliveries.

        Date span must not exceed 31 days. Cursor responses use
        `{ "data", "hasMore", "nextCursor" }` and are ordered newest-first.
        `sourceId`, `eventType`, and `toEmail` are populated for new delivery
        logs and remain nullable for historical rows.
      parameters:
        - $ref: "#/components/parameters/DestinationIdPath"
        - $ref: "#/components/parameters/DateRangeFrom"
        - $ref: "#/components/parameters/DateRangeTo"
        - $ref: "#/components/parameters/DeliveryStatusQuery"
        - $ref: "#/components/parameters/ActivityCursor"
        - $ref: "#/components/parameters/ActivityLimit"
      responses:
        "200":
          description: Cursor page of destination deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDeliveriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/destinations/{id}/deliveries/metrics:
    get:
      operationId: getDestinationDeliveryMetrics
      tags: [Destinations]
      summary: Success, error, and http2xx counts for one destination
      description: |
        Counts of outbound delivery attempts to one destination in the date
        range. `cursor`, `limit`, and `status` are ignored. Date span must not
        exceed 31 days. `http2xx` counts rows whose recorded HTTP status is in
        the 2xx range (including legacy rows where status was inferred).
      parameters:
        - $ref: "#/components/parameters/DestinationIdPath"
        - $ref: "#/components/parameters/DateRangeFrom"
        - $ref: "#/components/parameters/DateRangeTo"
      responses:
        "200":
          description: Delivery counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDeliveryMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/destinations/{id}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayDestinationDelivery
      tags: [Destinations]
      summary: Enqueue a replay of one destination delivery
      description: |
        No request body. Requires the API key's `write` scope. Connection-scoped
        keys can replay. The write check runs before the delivery is loaded, so
        a read-only key receives 403 even for an unknown id.

        Enqueue only — the response does not wait for the outbound POST. There
        is no status gate: any accessible delivery that still has a `payloadId`
        can be replayed (success or error).
      parameters:
        - $ref: "#/components/parameters/DestinationIdPath"
        - $ref: "#/components/parameters/DeliveryIdPath"
      responses:
        "200":
          description: Replay queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDeliveryReplayResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Valid key but no API-enabled connections (`canUseApi`), or the key
            is missing the `write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/deliveries:
    get:
      operationId: listDeliveries
      tags: [Destinations]
      summary: Account-wide destination delivery export
      description: |
        Delivery attempts across all accessible destinations — same row shape
        as `GET /api/v1/destinations/{id}/deliveries`. Date span must not
        exceed 31 days.

        When the key has no accessible destinations (and `destinationId` is
        omitted), the response is an empty page, not 404. An unknown or
        inaccessible `destinationId` query also returns an empty page.
      parameters:
        - $ref: "#/components/parameters/DateRangeFrom"
        - $ref: "#/components/parameters/DateRangeTo"
        - $ref: "#/components/parameters/DeliveryStatusQuery"
        - $ref: "#/components/parameters/DestinationIdQuery"
        - $ref: "#/components/parameters/ActivityCursor"
        - $ref: "#/components/parameters/ActivityLimit"
      responses:
        "200":
          description: Cursor page of destination deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDeliveriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/sources:
    get:
      operationId: listSources
      tags: [Sources]
      summary: List inbound sources
      description: |
        Inbound sources with the URL to paste into a sequencer, platform,
        config summary, and destination bindings.
      responses:
        "200":
          description: Named list wrapper
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/requests:
    get:
      operationId: listRequests
      tags: [Requests]
      summary: List inbound receipts for a date range
