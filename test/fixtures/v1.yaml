            type: integer
          description: Limit results to one accessible connection id
      responses:
        "200":
          description: Named list wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/blocklists/{id}/pause:
    post:
      operationId: pauseBlocklist
      tags: [Blocklists]
      summary: Pause a blocklist sync
      description: |
        Stops fetch and SEP push (`isEnabled: false`). Does not clear the SEP. Requires `write`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pause acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistPauseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing `write` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Blocklist not found for this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/blocklists/{id}/resync:
    post:
      operationId: resyncBlocklist
      tags: [Blocklists]
      summary: Resync a blocklist from the CRM
      description: |
        Enables the list and queues a full CRM reload. Does not clear the SEP. Requires `write`.
        `409` if already `FETCHING`/`SYNCING`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resync queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistResyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Missing `write` scope, or block lists not enabled on the connection (`canBlockList`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Blocklist not found for this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: |
            No CRM source to resync from, or an enabled resync is already `FETCHING`/`SYNCING`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: osapi
      description: |
        OutboundSync API key. Pass as `Authorization: Bearer osapi_<key>`.
        Keys are created in the OutboundSync dashboard.
  parameters:
    DateRangeFrom:
      name: from
      in: query
      required: true
      description: Start of the range (ISO-8601). Required with to; span must not exceed 31 days.
      schema:
        type: string
        format: date-time
      example: "2026-08-01T00:00:00.000Z"
    DateRangeTo:
      name: to
      in: query
      required: true
      description: End of the range (ISO-8601). Required with from; span must not exceed 31 days.
      schema:
        type: string
        format: date-time
      example: "2026-08-13T23:59:59.999Z"
    ActivityCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page (`nextCursor`).
      schema:
        type: string
    ActivityLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 100, max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      example: 100
    DeliveryStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by delivery outcome.
      schema:
        $ref: "#/components/schemas/DeliveryStatus"
      example: error
    DestinationIdPath:
      name: id
      in: path
      required: true
      description: Destination id.
      schema:
        type: integer
        minimum: 1
      example: 3
    DeliveryIdPath:
      name: deliveryId
      in: path
      required: true
      description: Destination delivery id.
      schema:
        type: integer
        minimum: 1
      example: 8801
    DestinationIdQuery:
      name: destinationId
      in: query
      required: false
      description: Restrict to one destination id. Unknown or inaccessible ids return an empty page, not 404.
      schema:
        type: integer
        minimum: 1
    ConnectionIdQuery:
      name: connectionId
      in: query
      required: false
      description: Restrict to one connection id. An id outside the key's access returns zeros for that scope, not 404.
      schema:
        type: integer
        minimum: 1
    SourceIdQuery:
      name: sourceId
      in: query
      required: false
      description: |
        Restrict requests and syncs to one source id on account metrics.
        Does not filter destinationDeliveries. Unknown or inaccessible ids
        return 404.
      schema:
        type: integer
        minimum: 1
    ObservabilitySourceIdQuery:
      name: sourceId
      in: query
      required: false
      description: Restrict to one source id. Unknown or inaccessible ids return 404.
      schema:
        type: integer
        minimum: 1
    SyncConnectionIdQuery:
      name: connectionId
      in: query
      required: false
      description: |
        Restrict to one connection id. An id outside the key's access returns
        an empty page (or zero counts on metrics), not 404.
      schema:
        type: integer
        minimum: 1
    SourceIdPath:
      name: sourceId
      in: path
      required: true
      description: Source id.
      schema:
        type: integer
        minimum: 1
      example: 10
    SyncIdPath:
      name: id
      in: path
      required: true
      description: Sync attempt id.
      schema:
        type: integer
        minimum: 1
      example: 4401
    SyncStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by sync outcome.
      schema:
        $ref: "#/components/schemas/SyncStatus"
      example: error
    WebhookIdPath:
      name: id
      in: path
      required: true
      description: Public webhook id (`oswhk_...`).
      schema:
        type: string
      example: oswhk_1a2b3c4d5e6f
    WebhookDeliveryIdPath:
      name: deliveryId
      in: path
      required: true
      description: Public Sync Monitoring delivery id (`oswhd_...`).
      schema:
        type: string
      example: oswhd_1a2b3c4d5e6f
    EventIdPath:
      name: id
      in: path
      required: true
      description: Public event id (`osevt_...`).
      schema:
        type: string
      example: osevt_1a2b3c4d5e6f
    PlatformDeliveryStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by Sync Monitoring delivery status.
      schema:
        $ref: "#/components/schemas/PlatformEventDeliveryStatus"
      example: FAILED
    EventTypeQuery:
      name: type
      in: query
      required: false
      description: |
        Filter by event type. Repeatable (`?type=sync.failed&type=sync.recovered`).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example: [sync.failed]
    DeliveredQuery:
      name: delivered
      in: query
      required: false
      description: |
        Filter by derived delivery success. Pass the strings `true` or `false`
        (not a JSON boolean).
      schema:
        type: string
        enum: ["true", "false"]
      example: "false"
    WebhookPageLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
  responses:
    Unauthorized:
      description: Missing, invalid, or revoked API key
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="OutboundSync API"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Valid key but no API-enabled connections (`canUseApi`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: |
        Rate limit exceeded — per-account 120 req/60s (sliding window), the
        per-IP pre-auth floor 120 req/60s (fixed window), or, on
        `contacts/outreach`, its own 600 req/60s per-account bucket (fixed
        window). Always sets Retry-After. Only the per-account limit sets the
        X-RateLimit-* headers; the per-IP and outreach 429s send Retry-After
        alone.
      headers:
        Retry-After:
          schema:
            type: string
            description: Seconds until the client may retry
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: |
        Missing or invalid query (from/to required ISO-8601, span at most 31
        days, from <= to, or malformed cursor).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource missing or not in the API key's accessible connections
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: |
        Sync retry is not eligible, or a source bulk retry cannot start.
        Messages include: `Sync is not eligible for retry`,
        `Sync is missing webhook or connection context`,
        `Retry is only supported for HubSpot and Salesforce syncs`,
        `Sync payload is no longer available to retry`,
        `User is not approved for this webhook`,
        `Sync is paused for this connection`, or
        `Sync is paused for this webhook receiver`.
        A pause or missing entitlement does not start the 24-hour window.
        A bulk retry already requested inside its 24-hour window is
        `SyncBulkRetryConflict` on `POST /api/v1/sources/{sourceId}/syncs/retry`,
        not this schema. That body includes `retryAvailableAt` and
        `retryAfterSeconds`, and its message points at
        `POST /api/v1/syncs/{id}/retry`, which has no daily limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    GatewayTimeout:
      description: |
        The request's database work exceeded the query time limit (20s) and was cancelled.
        Returned as JSON instead of the hosting router's HTML timeout page. For windowed
        endpoints, narrow `from`/`to` or pass `connectionId`; otherwise retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  headers:
    RateLimitLimit:
      description: Requests permitted per 60-second sliding window (per account).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current 60-second sliding window.
      schema:
        type: integer
    RateLimitReset:
      description: |
        Seconds until the oldest counted request ages out of the sliding window
        and the next request slot frees up (delta seconds, not a Unix timestamp).
      schema:
        type: integer
  schemas:
    # Health responses are intentionally forward-compatible (additionalProperties:
    # true): new component checks may appear under `checks` without a breaking
    # change, so these are not part of the additionalProperties:false drift guard.
    HealthLiveResponse:
      type: object
      additionalProperties: true
      required: [schema_version, status]
      properties:
        schema_version:
          type: integer
          description: Version of this response contract. Currently 3.
        status:
          type: string
          description: Always "operational" when the process is reachable.
    HealthReadyResponse:
      type: object
      additionalProperties: true
      required: [schema_version, status]
      properties:
        schema_version:
          type: integer
          description: Version of this response contract. Currently 3.
        status:
          type: string
          enum: [operational, partial_outage, major_outage]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [operational, outage]
          description: |
            Per-component status. Components present depend on the deployment
            (production/staging include the destination workers; local omits
            them). Treat unknown keys as forward-compatible.
    ApiError:
      type: object
      additionalProperties: false
      description: >-
        Body of every /api/v1 error response, including 404 for an unknown or unshipped path
        (`message: "Cannot GET /api/v1/…"`).
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
    MeRelatedLink:
      type: object
      additionalProperties: false
      required: [href, description]
      properties:
        href:
          type: string
        description:
          type: string
    MeLinks:
      type: object
      additionalProperties: false
      required:
        [
          accountStatus,
          accountMetrics,
          connections,
          contactsOutreach,
          destinations,
          requests,
          destinationsReplyRelays,
          sources,
          syncs,
          documentation,
          openapi,
        ]
      properties:
        accountStatus:
          $ref: "#/components/schemas/MeRelatedLink"
        accountMetrics:
          $ref: "#/components/schemas/MeRelatedLink"
        connections:
          $ref: "#/components/schemas/MeRelatedLink"
        contactsOutreach:
          $ref: "#/components/schemas/MeRelatedLink"
        destinations:
          $ref: "#/components/schemas/MeRelatedLink"
        requests:
          $ref: "#/components/schemas/MeRelatedLink"
        destinationsReplyRelays:
          $ref: "#/components/schemas/MeRelatedLink"
        sources:
          $ref: "#/components/schemas/MeRelatedLink"
        syncs:
          $ref: "#/components/schemas/MeRelatedLink"
        documentation:
          $ref: "#/components/schemas/MeRelatedLink"
        openapi:
          $ref: "#/components/schemas/MeRelatedLink"
    MeAccount:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
    MeApiKey:
      type: object
      additionalProperties: false
      required: [name, scopes, connectionScope, connectionId]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        connectionScope:
          type: string
          enum: [account, connection]
        connectionId:
          type: ["integer", "null"]
          description: |
            Set when connectionScope is connection; null for account-scoped keys.
            Same as connections[].id when scoped.
    MeConnection:
      type: object
      additionalProperties: false
      required: [id, crm, organizationId, organizationDomain]
      properties:
        id:
          type: integer
        crm:
          type: string
        organizationId:
          type: ["string", "null"]
        organizationDomain:
          type: ["string", "null"]
    MeResponse:
      type: object
      additionalProperties: false
      required: [account, apiKey, connections, links]
      properties:
        account:
          $ref: "#/components/schemas/MeAccount"
        apiKey:
          $ref: "#/components/schemas/MeApiKey"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/MeConnection"
        links:
          $ref: "#/components/schemas/MeLinks"
    BlockerCode:
      type: string
      enum:
        - crm_disconnected
        - sync_not_enabled
        - no_sources
    WarningCode:
      type: string
      enum:
        - destinations_not_configured
        - blocklists_not_configured
        - blocklists_error
    StatusBlocker:
      type: object
      additionalProperties: false
      required: [code, connectionId, crm, message, remediation, docUrl]
      properties:
        code:
          $ref: "#/components/schemas/BlockerCode"
        connectionId:
          type: integer
        crm:
          type: string
        message:
          type: string
        remediation:
          type: string
        docUrl:
          type: string
          format: uri
    StatusWarning:
      type: object
      additionalProperties: false
      required: [code, connectionId, crm, message, remediation, docUrl]
      properties:
        code:
          $ref: "#/components/schemas/WarningCode"
        connectionId:
          type: integer
        crm:
          type: string
        message:
          type: string
        remediation:
          type: string
        docUrl:
          type: string
          format: uri
    CrmConnectionStatus:
      type: object
      additionalProperties: false
      required: [status, crm, organizationId, organizationDomain]
      properties:
        status:
          type: string
          enum: [ready, disconnected]
        crm:
          type: string
        organizationId:
          type: ["string", "null"]
        organizationDomain:
          type: ["string", "null"]
    SourcesStatus:
      type: object
      additionalProperties: false
      required: [status, count, platforms]
      properties:
        status:
          type: string
          enum: [ready, not_configured, disabled]
        count:
          type: integer
        platforms:
          type: array
          items:
            type: string
    DestinationsStatus:
      type: object
      additionalProperties: false
      required: [status, count, eventTypes, forwardingCount, replyRelayCount]
      properties:
        status:
          type: string
          enum: [ready, not_configured, disabled]
        count:
          type: integer
          description: Distinct forwarding URLs + bound reply relays.
        eventTypes:
          type: array
          items:
            type: string
        forwardingCount:
          type: integer
        replyRelayCount:
          type: integer
    BlocklistsStatus:
      type: object
      additionalProperties: false
      required: [status, enabledCount, lastError, lastFetchedAt]
      properties:
        status:
          type: string
          enum: [ready, not_configured, disabled, error]
        enabledCount:
          type: integer
        lastError:
          type: ["string", "null"]
        lastFetchedAt:
          type: ["string", "null"]
          format: date-time
    ConnectionStatus:
      type: object
      additionalProperties: false
      required:
        - connectionId
        - crm
        - ready
        - crmConnection
        - sources
        - destinations
        - blocklists
      properties:
        connectionId:
          type: integer
        crm:
          type: string
        ready:
          type: boolean
        crmConnection:
          $ref: "#/components/schemas/CrmConnectionStatus"
        sources:
          $ref: "#/components/schemas/SourcesStatus"
        destinations:
          $ref: "#/components/schemas/DestinationsStatus"
        blocklists:
          $ref: "#/components/schemas/BlocklistsStatus"
    AccountStatusResponse:
      type: object
      additionalProperties: false
      required: [ready, checkedAt, connections, blockers, warnings]
      properties:
        ready:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionStatus"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/StatusBlocker"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/StatusWarning"
    ConnectionCapabilities:
      type: object
      additionalProperties: false
      required: [sync, destinations, blocklists]
      properties:
        sync:
          type: boolean
        destinations:
          type: boolean
        blocklists:
          type: boolean
    ConnectionResource:
      type: object
      additionalProperties: false
      required:
        - id
        - crm
        - status
        - organizationId
        - organizationDomain
        - capabilities
        - createdAt
      properties:
        id:
          type: integer
        crm:
          type: string
        status:
          type: string
          enum: [ready, disconnected]
        organizationId:
          type: ["string", "null"]
        organizationDomain:
          type: ["string", "null"]
        capabilities:
          $ref: "#/components/schemas/ConnectionCapabilities"
        createdAt:
          type: string
          format: date-time
    ConnectionsResponse:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionResource"
    SourceConfig:
      type: object
      additionalProperties: false
      required:
        - createOrUpdateCompany
        - createOrUpdateTask
        - assignContactOwner
        - salesforceObjectType
        - excludeFreeEmailDomains
        - salesforceNoCompanyAccount
      properties:
        createOrUpdateCompany:
          type: boolean
        createOrUpdateTask:
          type: boolean
        assignContactOwner:
          type: boolean
        salesforceObjectType:
          type: ["string", "null"]
        excludeFreeEmailDomains:
          type: boolean
          description: >-
            Skip free/personal email domains (gmail.com, yahoo.com, …) when matching or creating
            CRM companies. The company website from the sales engagement platform, then the company
            name, are used instead.
        salesforceNoCompanyAccount:
          type: string
          enum: [DEDICATED, NONE, SHARED]
          description: >-
            Salesforce Contact syncs only: Account for contacts with no usable company. DEDICATED creates
            one Account per contact, NONE creates the Contact without an Account, SHARED pools them under
            one "Unknown Company" Account. Returned for every source.
    SourceDestination:
      type: object
      additionalProperties: false
      required: [url, description, eventTypes, isDelayed]
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        isDelayed:
          type: boolean
    SourceReplyRelay:
      type: object
      additionalProperties: false
      required: [id, description, ccEmail, delayMinutes]
      properties:
        id:
          type: integer
        description:
          type: string
        ccEmail:
          type: string
        delayMinutes:
          type: integer
    Source:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - platform
        - connectionId
        - crm
        - syncEnabled
        - config
        - destinations
        - replyRelay
        - createdAt
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
          description: Paste URL for the sequencer (includes webhook ingress code).
        platform:
          type: string
        connectionId:
          type: integer
        crm:
          type: string
        syncEnabled:
          type: boolean
          description: Per-source CRM sync switch. When false, inbound events are held and not synced to the CRM, and retry returns 409.
        config:
          $ref: "#/components/schemas/SourceConfig"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/SourceDestination"
        replyRelay:
          oneOf:
            - $ref: "#/components/schemas/SourceReplyRelay"
            - type: "null"
        createdAt:
          type: string
          format: date-time
    SourcesResponse:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    StepStatus:
      type: string
      enum: [pending, ready, waiting, error, skipped, blocked]
    SetupStep:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        message:
          type: string
        remediation:
          type: string
        docUrl:
          type: string
        blockerCode:
          type: string
    SourceSetupTestStatus:
      type: object
      additionalProperties: false
      required: [status, lastSucceededAt, lastAttemptedAt]
      properties:
        status:
          type: string
          enum: [pending, ready, error]
        lastSucceededAt:
          type: ["string", "null"]
          format: date-time
        lastAttemptedAt:
          type: ["string", "null"]
          format: date-time
    SourceSetupSepInbound:
      type: object
      additionalProperties: false
      required: [status, lastReceivedAt]
      properties:
        status:
          type: string
          enum: [waiting, ready]
        lastReceivedAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            When live traffic first proved this source, refreshed at most hourly thereafter —
            treat it as "has live traffic arrived", not as a liveness heartbeat.
        blocker:
          $ref: "#/components/schemas/SetupStep"
    SourceSetupStatus:
      type: object
      additionalProperties: false
      required: [sourceId, platform, code, test, sepInbound, steps]
      properties:
        sourceId:
          type: integer
        platform:
          type: string
        code:
          type: string
        test:
          $ref: "#/components/schemas/SourceSetupTestStatus"
        sepInbound:
          $ref: "#/components/schemas/SourceSetupSepInbound"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SetupStep"
    ConnectionSetupStatus:
      type: object
      additionalProperties: false
      required: [connectionId, crm, crmConnected, syncEntitled, sources, softAcks]
      properties:
        connectionId:
          type: integer
        crm:
          type: string
        crmConnected:
          type: boolean
        syncEntitled:
          type: boolean
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceSetupStatus"
        softAcks:
          type: array
          items:
            type: string
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required: [checkedAt, wizardDisabled, step0, connections, steps]
      properties:
        checkedAt:
          type: string
          format: date-time
